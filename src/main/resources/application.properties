spring.application.name=SpringSecurityDemo
server.port=8085
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/demo_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.data.jdbc.dialect=postgresql
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.security.oauth2.client.registration.google.client-id=GOOLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=GOOLE_CLIENT_ID
spring.security.oauth2.client.registration.google.scope=[profile, email]
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
logging.level.org.springframework.security=TRACE